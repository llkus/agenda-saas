{% extends "base.html" %}
{% block title %}{{ "Editar" if servico else "Novo" }} serviço — Agenda SaaS{% endblock %}
{% block content %}
{% include "partials/_nav.html" %}
<div class="max-w-md mx-auto mt-8 px-4 pb-12">
  <div class="bg-surf-1 border border-hair rounded-lg p-6">
    <h1 class="text-lg font-medium text-off mb-4">{{ "Editar" if servico else "Novo" }} serviço</h1>

    <form method="post" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="nome">Nome</label>
        <input class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
               type="text" name="nome" id="nome"
               value="{{ servico.nome if servico else (form.nome if form else '') }}" required>
      </div>

      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="duracao_min">Duração (minutos)</label>
        <input class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
               type="number" min="1" name="duracao_min" id="duracao_min"
               value="{{ servico.duracao_min if servico else (form.duracao_min if form else '') }}" required>
      </div>

      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="preco">Preço (R$)</label>
        <input class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
               type="text" inputmode="decimal" name="preco" id="preco"
               value="{{ servico.preco if servico else (form.preco if form else '') }}" required>
      </div>

      <div class="flex gap-3 pt-2">
        <button class="bg-amber-500 text-canvas font-medium rounded-chip px-4 py-2 hover:shadow-amber transition-shadow" type="submit">Salvar</button>
        <a href="{{ url_for('servicos.listar') }}" class="text-txt-3 hover:text-off px-4 py-2 transition-colors">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
