{% extends "base_painel.html" %}
{% block title %}Novo agendamento — Agenda SaaS{% endblock %}
{% block painel_content %}
<div class="max-w-md mx-auto pb-12">
  <div class="bg-surf-1 border border-hair rounded-lg p-6">
    <h1 class="text-lg font-medium text-off mb-4">Novo agendamento</h1>

    <form method="post" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="cliente_id">Cliente</label>
        <select class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
                name="cliente_id" id="cliente_id" required>
          <option class="bg-canvas" value="">Selecione...</option>
          {% for cliente in clientes %}
          <option class="bg-canvas" value="{{ cliente.id }}" {{ "selected" if form.cliente_id == cliente.id|string else "" }}>{{ cliente.nome }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="servico_id">Serviço</label>
        <select class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
                name="servico_id" id="servico_id" required>
          <option class="bg-canvas" value="">Selecione...</option>
          {% for servico in servicos %}
          <option class="bg-canvas" value="{{ servico.id }}" {{ "selected" if form.servico_id == servico.id|string else "" }}>
            {{ servico.nome }} ({{ servico.duracao_min }} min)
          </option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="data">Data</label>
        <input class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
               type="date" name="data" id="data"
               value="{{ form.data if form else '' }}" required>
      </div>

      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="horario">Horário</label>
        <select class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
                name="horario" id="horario" required>
          <option class="bg-canvas" value="">Escolha cliente, serviço e data primeiro</option>
        </select>
      </div>

      <div class="flex gap-3 pt-2">
        <button class="bg-amber-500 text-canvas font-medium rounded-chip px-4 py-2 hover:shadow-amber transition-shadow" type="submit">Salvar</button>
        <a href="{{ url_for('agendamentos.listar') }}" class="text-txt-3 hover:text-off px-4 py-2 transition-colors">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<script>
  const servicoEl = document.getElementById("servico_id");
  const dataEl = document.getElementById("data");
  const horarioEl = document.getElementById("horario");

  async function atualizarHorarios() {
    const servicoId = servicoEl.value;
    const data = dataEl.value;

    if (!servicoId || !data) {
      horarioEl.innerHTML = '<option value="">Escolha cliente, serviço e data primeiro</option>';
      return;
    }

    horarioEl.innerHTML = '<option value="">Carregando...</option>';

    const params = new URLSearchParams({ servico_id: servicoId, data: data });
    const resp = await fetch(`{{ url_for('agendamentos.horarios_disponiveis_endpoint') }}?${params}`);
    const horarios = await resp.json();

    if (horarios.length === 0) {
      horarioEl.innerHTML = '<option value="">Nenhum horário disponível nesse dia</option>';
      return;
    }

    horarioEl.innerHTML = horarios.map(h => `<option class="bg-canvas" value="${h}">${h}</option>`).join("");
  }

  servicoEl.addEventListener("change", atualizarHorarios);
  dataEl.addEventListener("change", atualizarHorarios);
</script>
{% endblock %}
