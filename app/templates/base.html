<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agenda SaaS{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: "#0b100d",
            off: "#f2efe7",
            "txt-1": "#f2efe7",
            "txt-2": "#f2efe79e",
            "txt-3": "#f2efe761",
            "surf-1": "#ffffff0b",
            "surf-2": "#ffffff13",
            "surf-3": "#ffffff1c",
            hair: "#ffffff17",
            "hair-top": "#ffffff29",
            amber: { 300: "#f6c77c", 500: "#e8a33d", 900: "#3a2606" },
            leaf: { 300: "#7fcb9f", 500: "#3ea76b", 700: "#1f6b42" },
            terra: { DEFAULT: "#e0876b", 500: "#b44632" },
          },
          borderRadius: {
            chip: "999px",
            sm: "12px",
            md: "18px",
            lg: "26px",
            xl: "34px",
          },
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
          },
          boxShadow: {
            amber: "0 8px 22px -8px #e8a33da6",
          },
        },
      },
    };
  </script>
  <style>
    body { font-weight: 400; }
  </style>
</head>
<body class="bg-canvas text-txt-1 font-sans min-h-screen">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="max-w-md mx-auto mt-4 space-y-2 px-4">
        {% for category, message in messages %}
          <div class="px-4 py-2 rounded-md text-sm border {{ 'bg-terra-500/10 border-terra-500/40 text-terra' if category == 'error' else 'bg-leaf-500/10 border-leaf-500/40 text-leaf-300' }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
