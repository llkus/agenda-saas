{% extends "base.html" %}
{% block title %}Login — Agenda SaaS{% endblock %}
{% block content %}
<div class="flex items-center justify-center mt-24 px-4">
  <form method="post" class="bg-surf-1 border border-hair backdrop-blur rounded-lg p-8 w-full max-w-sm space-y-5 shadow-2xl">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <h1 class="text-xl font-medium text-ink">Entrar</h1>
      <p class="text-txt-3 text-sm mt-1">Acesse o painel do seu estabelecimento</p>
    </div>

    <div>
      <label class="block text-sm text-txt-2 mb-1.5" for="email">Email</label>
      <input class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 placeholder-txt-3 outline-none focus:border-amber-500 transition-colors"
             type="email" name="email" id="email" required autofocus>
    </div>

    <div>
      <label class="block text-sm text-txt-2 mb-1.5" for="senha">Senha</label>
      <input class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 placeholder-txt-3 outline-none focus:border-amber-500 transition-colors"
             type="password" name="senha" id="senha" required>
    </div>

    <button class="w-full bg-amber-500 text-[#2b1b04] font-medium rounded-chip px-4 py-2.5 hover:shadow-amber transition-shadow" type="submit">
      Entrar
    </button>
  </form>
</div>
{% endblock %}
