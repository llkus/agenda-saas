{% extends "base_painel.html" %}
{% block title %}{{ "Editar" if cliente else "Novo" }} cliente — Agenda SaaS{% endblock %}
{% block painel_content %}
<div class="max-w-md mx-auto pb-12">
  <div class="vidro rounded-lg p-6">
    <h1 class="text-lg font-medium text-ink mb-4">{{ "Editar" if cliente else "Novo" }} cliente</h1>

    <form method="post" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="nome">Nome</label>
        <input class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
               type="text" name="nome" id="nome"
               value="{{ cliente.nome if cliente else (form.nome if form else '') }}" required>
      </div>

      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="telefone">Telefone</label>
        <input class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
               type="text" name="telefone" id="telefone"
               value="{{ cliente.telefone if cliente else (form.telefone if form else '') }}" required>
      </div>

      <div class="flex gap-3 pt-2">
        <button class="bg-amber-500 text-[#2b1b04] font-medium rounded-chip px-4 py-2 hover:shadow-amber transition-shadow" type="submit">Salvar</button>
        <a href="{{ url_for('clientes.listar') }}" class="text-txt-3 hover:text-ink px-4 py-2 transition-colors">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
