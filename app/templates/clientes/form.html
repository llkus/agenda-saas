{% extends "base.html" %}
{% block title %}{{ "Editar" if cliente else "Novo" }} cliente — Agenda SaaS{% endblock %}
{% block content %}
{% include "partials/_nav.html" %}
<div class="max-w-md mx-auto mt-8 bg-white p-6 rounded-lg shadow-md">
  <h1 class="text-lg font-semibold text-slate-800 mb-4">{{ "Editar" if cliente else "Novo" }} cliente</h1>

  <form method="post" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm text-slate-600 mb-1" for="nome">Nome</label>
      <input class="w-full border border-slate-300 rounded px-3 py-2" type="text" name="nome" id="nome"
             value="{{ cliente.nome if cliente else (form.nome if form else '') }}" required>
    </div>

    <div>
      <label class="block text-sm text-slate-600 mb-1" for="telefone">Telefone</label>
      <input class="w-full border border-slate-300 rounded px-3 py-2" type="text" name="telefone" id="telefone"
             value="{{ cliente.telefone if cliente else (form.telefone if form else '') }}" required>
    </div>

    <div class="flex gap-3">
      <button class="bg-slate-800 text-white rounded px-4 py-2 hover:bg-slate-700" type="submit">Salvar</button>
      <a href="{{ url_for('clientes.listar') }}" class="text-slate-500 px-4 py-2 hover:underline">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
