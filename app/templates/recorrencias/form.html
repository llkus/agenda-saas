{% extends "base_painel.html" %}
{% block title %}Novo cliente fixo — Agenda SaaS{% endblock %}
{% block painel_content %}
<div class="max-w-md mx-auto pb-12">
  <div class="vidro rounded-lg p-6">
    <h1 class="text-lg font-medium text-ink mb-4">Novo cliente fixo</h1>

    <form method="post" class="space-y-4" id="form-recorrencia">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="cliente_id">Cliente</label>
        <select class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
                name="cliente_id" id="cliente_id" required>
          <option class="bg-canvas" value="">Selecione...</option>
          {% for cliente in clientes %}
          <option class="bg-canvas" value="{{ cliente.id }}" {{ "selected" if form.cliente_id == cliente.id|string else "" }}>{{ cliente.nome }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="servico_id">Serviço</label>
        <select class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
                name="servico_id" id="servico_id" required>
          <option class="bg-canvas" value="">Selecione...</option>
          {% for servico in servicos %}
          <option class="bg-canvas" value="{{ servico.id }}" {{ "selected" if form.servico_id == servico.id|string else "" }}>{{ servico.nome }} ({{ servico.duracao_min }} min)</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm text-txt-2 mb-1.5" for="dia_semana">Dia da semana</label>
        <select class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
                name="dia_semana" id="dia_semana" required>
          {% for nome in dias_semana %}
          <option class="bg-canvas" value="{{ loop.index0 }}">{{ nome }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-txt-2 mb-1.5" for="hora">Horário</label>
          <input class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
                 type="time" name="hora" id="hora" value="{{ form.hora if form else '10:00' }}" required>
        </div>
        <div>
          <label class="block text-sm text-txt-2 mb-1.5" for="intervalo_semanas">A cada</label>
          <select class="w-full bg-surf-1 border border-hair-top rounded-sm px-3 py-2 text-txt-1 outline-none focus:border-amber-500 transition-colors"
                  name="intervalo_semanas" id="intervalo_semanas">
            <option class="bg-canvas" value="1">1 semana</option>
            <option class="bg-canvas" value="2" selected>2 semanas</option>
            <option class="bg-canvas" value="4">4 semanas</option>
          </select>
        </div>
      </div>

      <div id="previa" class="hidden border border-hair rounded-sm bg-canvas p-3">
        <p class="eyebrow mb-1">próximas datas</p>
        <div id="previa-lista" class="text-[13px] space-y-1"></div>
      </div>

      <div class="flex gap-3 pt-2">
        <button class="bg-amber-500 text-[#2b1b04] font-medium rounded-chip px-4 py-2 hover:shadow-amber transition-shadow" type="submit">Salvar regra</button>
        <a href="{{ url_for('recorrencias.listar') }}" class="text-txt-3 hover:text-ink px-4 py-2 transition-colors">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<script>
  const campos = ["cliente_id", "servico_id", "dia_semana", "hora", "intervalo_semanas"].map(id => document.getElementById(id));
  const previa = document.getElementById("previa");
  const previaLista = document.getElementById("previa-lista");

  async function atualizarPrevia() {
    const [clienteId, servicoId, diaSemana, hora, intervalo] = campos.map(c => c.value);
    if (!clienteId || !servicoId || diaSemana === "" || !hora) {
      previa.classList.add("hidden");
      return;
    }
    const params = new URLSearchParams({
      cliente_id: clienteId, servico_id: servicoId, dia_semana: diaSemana,
      hora: hora, intervalo_semanas: intervalo,
    });
    const resp = await fetch(`{{ url_for('recorrencias.previa') }}?${params}`);
    const ocorrencias = await resp.json();

    if (ocorrencias.length === 0) {
      previa.classList.add("hidden");
      return;
    }
    previaLista.innerHTML = ocorrencias.map(oc => {
      const data = new Date(oc.data + "T00:00:00").toLocaleDateString("pt-BR");
      const status = oc.cabe
        ? '<span class="selo alta">cabe</span>'
        : `<span class="text-terra-500 text-[12px]">${oc.impedimento}</span>`;
      return `<div class="flex items-baseline justify-between"><span class="text-txt-2">${data}</span>${status}</div>`;
    }).join("");
    previa.classList.remove("hidden");
  }

  campos.forEach(c => c.addEventListener("change", atualizarPrevia));
</script>
{% endblock %}
